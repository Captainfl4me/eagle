# docker-compose.yml
version: '3.8'
services:
  eagle:
    build: .
    image: ghcr.io/captainfl4me/eagle
    container_name: eagle
    restart: unless-stopped
    environment:
      - DB_DATABASE=/data/eagle.sqlite
      - APP_ENV=production
      # Replace with your own public URL (scheme included). It is used for
      # mail, queued jobs and console URL generation. Behind an HTTPS reverse
      # proxy, asset URLs are handled by the trusted-proxy middleware
      # (see bootstrap/app.php), which honors X-Forwarded-Proto.
      - APP_URL=https://eagle.example.com
      - CACHE_STORE=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
      - MAIL_MAILER=log
    volumes:
      - ./data:/data
    ports:
      - '8080:8080'